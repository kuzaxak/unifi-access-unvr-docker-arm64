services:
  unifi-os:
    image: unifi-os-docker-arm64:stable
    tty: true
    hostname: UNVR
    extra_hosts:
      - "UNVR:127.0.1.1"
    container_name: unifi-os
    stop_grace_period: 2m
    cgroup: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup
      - ./storage/srv:/srv
      - ./storage/data:/data
      - ./storage/persistent:/persistent
    environment:
      - container=docker
      - DEVICE=UNVR
      - DEBUG=false
    restart: unless-stopped
    cap_add:
      - dac_read_search
      - sys_admin
    security_opt:
      - apparmor=unconfined
      - seccomp=unconfined
    tmpfs:
      - /run
      - /run/lock
      - /tmp
      - /var/run
      - /var/run/lock
    privileged: true
    # Host networking is required for both Access door device adoption and
    # Protect camera adoption. Access UA-Hub / readers broadcast on UDP 10001
    # for L2 discovery and have no equivalent of the UniFi Network
    # `set-inform` CLI. Protect cameras use ONVIF + mDNS on the same LAN.
    # Bridge mode + port mapping does not work for real hardware adoption -
    # use docker-compose.macos.yml only for lab-mode UI inspection.
    network_mode: host
